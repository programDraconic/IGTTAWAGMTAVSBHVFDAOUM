name: Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.FUNCTIONAL_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.FUNCTIONAL_PWD }}
          # Only add this if account activation fails (see notes):
          # UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          testMode: all   # runs your BOUNDARY tests

# NOTE: the stress test is NOT a CI test - it's a manual
# measurement; its breaking point goes to TL6 for platform limits.